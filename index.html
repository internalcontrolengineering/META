<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M.E.T.A. - Asistente de Voz</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #000;
    color: #fff;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    background: radial-gradient(ellipse at center, #0a0a1a 0%, #000 70%);
  }

  .particles {
    position: absolute;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }

  .particle {
    position: absolute;
    width: 2px;
    height: 2px;
    background: rgba(0, 200, 255, 0.6);
    border-radius: 50%;
    box-shadow: 0 0 6px rgba(0, 200, 255, 0.8);
    animation: floatParticle linear infinite;
  }

  @keyframes floatParticle {
    from { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    to { transform: translateY(-10vh) scale(1); opacity: 0; }
  }

  .app-container {
    opacity: 0;
    transition: opacity 0.8s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    width: 100%;
    position: relative;
  }

  .app-container.visible {
    opacity: 1;
  }

  /* Orbe clickeable */
  .orb-container {
    position: relative;
    width: 420px;
    height: 420px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    transition: filter 0.8s ease, opacity 0.8s ease, transform 0.3s ease;
    cursor: pointer;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .orb-container:hover {
    transform: scale(1.03);
  }

  .orb-container:active {
    transform: scale(0.98);
  }

  /* Estado apagado */
  .orb-container.off {
    filter: grayscale(0.7) brightness(0.4);
    opacity: 0.5;
  }

  .orb-container.off .orb-core {
    animation: none;
    transform: scale(1);
    filter: blur(8px) brightness(0.6);
  }

  .orb-container.off .orb-ring-1,
  .orb-container.off .orb-ring-2,
  .orb-container.off .orb-ring-3 {
    animation: none;
    border-width: 1px;
    filter: blur(3px) brightness(0.4);
  }

  .orb-container.off .orb-layer-1,
  .orb-container.off .orb-layer-2,
  .orb-container.off .orb-layer-3 {
    animation-play-state: paused;
    opacity: 0.3;
  }

  /* Pulso al hacer clic */
  .orb-container.clicked .orb-core {
    animation: clickedPulse 0.6s ease-out;
  }

  @keyframes clickedPulse {
    0% { transform: scale(1); }
    40% { transform: scale(1.4); filter: blur(20px) brightness(2.5); }
    100% { transform: scale(1.08); }
  }

  .orb-layer {
    position: absolute;
    border-radius: 50%;
    mix-blend-mode: screen;
    filter: blur(20px);
    transition: opacity 0.5s ease;
  }

  .orb-core {
    width: 180px;
    height: 180px;
    background: radial-gradient(circle at 40% 40%, 
      #ffffff 0%, 
      #a0f0ff 15%, 
      #00d4ff 35%, 
      #0066ff 55%, 
      #001a66 80%, 
      transparent 100%);
    filter: blur(8px) brightness(1.3);
    animation: corePulse 3s ease-in-out infinite;
    z-index: 10;
  }

  @keyframes corePulse {
    0%, 100% { transform: scale(1); filter: blur(8px) brightness(1.3); }
    50% { transform: scale(1.08); filter: blur(12px) brightness(1.6); }
  }

  .orb-layer-1 {
    width: 280px;
    height: 280px;
    background: radial-gradient(circle, 
      rgba(0, 212, 255, 0.6) 0%, 
      rgba(0, 100, 255, 0.3) 40%, 
      transparent 70%);
    animation: rotateLayer1 8s linear infinite;
  }

  .orb-layer-2 {
    width: 340px;
    height: 340px;
    background: radial-gradient(circle, 
      rgba(100, 0, 255, 0.4) 0%, 
      rgba(0, 150, 255, 0.2) 50%, 
      transparent 75%);
    animation: rotateLayer2 12s linear infinite reverse;
  }

  .orb-layer-3 {
    width: 400px;
    height: 400px;
    background: radial-gradient(circle, 
      rgba(0, 255, 200, 0.15) 0%, 
      rgba(0, 100, 255, 0.1) 50%, 
      transparent 80%);
    animation: rotateLayer3 16s linear infinite;
  }

  .orb-ring {
    position: absolute;
    border-radius: 50%;
    border: 1.5px solid transparent;
    background: conic-gradient(from 0deg, 
      transparent 0%, 
      rgba(0, 212, 255, 0.8) 20%, 
      rgba(100, 0, 255, 0.6) 40%, 
      rgba(0, 255, 200, 0.8) 60%, 
      rgba(0, 100, 255, 0.6) 80%, 
      transparent 100%) border-box;
    -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    filter: blur(1px) brightness(1.4);
  }

  .orb-ring-1 {
    width: 220px;
    height: 220px;
    animation: spin 4s linear infinite, ringPulse 2s ease-in-out infinite;
  }

  .orb-ring-2 {
    width: 260px;
    height: 260px;
    animation: spin 6s linear infinite reverse, ringPulse 2.5s ease-in-out infinite 0.3s;
    opacity: 0.7;
  }

  .orb-ring-3 {
    width: 300px;
    height: 300px;
    animation: spin 9s linear infinite, ringPulse 3s ease-in-out infinite 0.6s;
    opacity: 0.5;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes ringPulse {
    0%, 100% { opacity: 0.6; }
    50% { opacity: 1; }
  }

  @keyframes rotateLayer1 { to { transform: rotate(360deg); } }
  @keyframes rotateLayer2 { to { transform: rotate(360deg); } }
  @keyframes rotateLayer3 { to { transform: rotate(360deg); } }

  .orb-container.listening .orb-core {
    animation: coreListening 0.8s ease-in-out infinite;
    filter: blur(10px) brightness(1.8) hue-rotate(20deg);
  }

  @keyframes coreListening {
    0%, 100% { transform: scale(1.1); }
    50% { transform: scale(1.25); }
  }

  .orb-container.speaking .orb-core {
    animation: coreSpeaking 0.4s ease-in-out infinite;
    filter: blur(14px) brightness(2) hue-rotate(-30deg);
  }

  @keyframes coreSpeaking {
    0%, 100% { transform: scale(1.15); }
    50% { transform: scale(1.35); }
  }

  .orb-container.listening .orb-ring-1,
  .orb-container.listening .orb-ring-2 {
    border-width: 3px;
    filter: blur(2px) brightness(1.8);
  }

  .orb-container.speaking .orb-ring-1,
  .orb-container.speaking .orb-ring-2,
  .orb-container.speaking .orb-ring-3 {
    border-width: 3px;
    filter: blur(2px) brightness(2);
  }

  .status-indicator {
    position: absolute;
    bottom: 60px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    z-index: 20;
  }

  .status-text {
    font-size: 15px;
    letter-spacing: 2px;
    color: #00d4ff;
    text-shadow: 0 0 15px rgba(0, 212, 255, 0.8);
    font-weight: 300;
    transition: all 0.3s ease;
    min-height: 20px;
    font-style: italic;
  }

  .status-text.active {
    color: #00ffcc;
    text-shadow: 0 0 25px rgba(0, 255, 204, 1);
  }

  .status-text.off {
    color: rgba(120, 120, 140, 0.7);
    text-shadow: none;
  }

  .transcript {
    position: fixed;
    bottom: 150px;
    left: 50%;
    transform: translateX(-50%);
    max-width: 80vw;
    text-align: center;
    font-size: 16px;
    color: rgba(255, 255, 255, 0.9);
    text-shadow: 0 0 10px rgba(0, 212, 255, 0.5);
    padding: 12px 24px;
    background: rgba(0, 20, 40, 0.5);
    border-radius: 30px;
    border: 1px solid rgba(0, 212, 255, 0.2);
    backdrop-filter: blur(10px);
    min-height: 20px;
    transition: all 0.3s ease;
    opacity: 0;
    pointer-events: none;
    z-index: 15;
    font-style: italic;
  }

  .transcript.visible {
    opacity: 1;
  }

  .meta-title {
    position: absolute;
    top: 40px;
    font-size: 28px;
    letter-spacing: 12px;
    font-weight: 200;
    color: rgba(0, 212, 255, 0.7);
    text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
    text-transform: uppercase;
    transition: all 0.8s ease;
  }

  .meta-title.off {
    color: rgba(100, 100, 120, 0.3);
    text-shadow: none;
  }

  .logo-ring {
    position: absolute;
    top: 90px;
    font-size: 11px;
    letter-spacing: 4px;
    color: rgba(0, 212, 255, 0.4);
    text-transform: uppercase;
    font-style: italic;
    transition: all 0.8s ease;
  }

  .logo-ring.off {
    color: rgba(100, 100, 120, 0.25);
  }

  .waves {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 100px;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 3px;
    padding-bottom: 10px;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }

  .waves.active {
    opacity: 1;
  }

  .wave-bar {
    width: 3px;
    background: linear-gradient(to top, #0066ff, #00d4ff, #00ffcc);
    border-radius: 3px;
    box-shadow: 0 0 10px rgba(0, 212, 255, 0.8);
    transition: height 0.1s ease;
    min-height: 4px;
  }

  .hint {
    position: absolute;
    bottom: 20px;
    font-size: 12px;
    color: rgba(0, 212, 255, 0.35);
    letter-spacing: 1px;
    font-style: italic;
    text-align: center;
    transition: all 0.8s ease;
    padding: 0 20px;
  }

  .hint.off {
    color: rgba(100, 100, 120, 0.3);
  }

  /* Notificación visual de acción */
  .action-toast {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    padding: 24px 40px;
    background: linear-gradient(135deg, rgba(0, 212, 255, 0.15), rgba(0, 100, 255, 0.1));
    border: 2px solid rgba(0, 255, 204, 0.6);
    border-radius: 20px;
    backdrop-filter: blur(20px);
    box-shadow: 0 0 60px rgba(0, 255, 204, 0.5);
    text-align: center;
    opacity: 0;
    pointer-events: none;
    z-index: 500;
    transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .action-toast.visible {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
  }

  .action-toast-icon {
    font-size: 42px;
    margin-bottom: 12px;
  }

  .action-toast-text {
    font-size: 15px;
    color: #00ffcc;
    letter-spacing: 1.5px;
    font-style: italic;
  }

  /* Overlay de carga */
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, #0a0a1a 0%, #000 70%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 2000;
    transition: opacity 0.8s ease, visibility 0.8s ease;
  }

  .loading-overlay.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .loading-orb {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, 
      #ffffff 0%, 
      #a0f0ff 15%, 
      #00d4ff 40%, 
      #0066ff 65%, 
      transparent 100%);
    filter: blur(6px) brightness(1.4);
    animation: loadingPulse 1.5s ease-in-out infinite;
    box-shadow: 0 0 80px rgba(0, 212, 255, 0.7);
    margin-bottom: 30px;
  }

  @keyframes loadingPulse {
    0%, 100% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.15); opacity: 1; }
  }

  .loading-text {
    font-size: 13px;
    letter-spacing: 4px;
    color: rgba(0, 212, 255, 0.7);
    text-transform: uppercase;
    font-style: italic;
    animation: loadingTextPulse 2s ease-in-out infinite;
    text-align: center;
    padding: 0 20px;
  }

  @keyframes loadingTextPulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  @media (max-width: 500px) {
    .orb-container { width: 320px; height: 320px; }
    .orb-core { width: 140px; height: 140px; }
    .orb-layer-1 { width: 220px; height: 220px; }
    .orb-layer-2 { width: 270px; height: 270px; }
    .orb-layer-3 { width: 310px; height: 310px; }
    .orb-ring-1 { width: 170px; height: 170px; }
    .orb-ring-2 { width: 200px; height: 200px; }
    .orb-ring-3 { width: 240px; height: 240px; }
    .meta-title { font-size: 20px; letter-spacing: 8px; }
    .transcript { font-size: 13px; bottom: 130px; }
    .loading-orb { width: 90px; height: 90px; }
  }
</style>
</head>
<body>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-orb"></div>
    <div class="loading-text" id="loadingText">Despertando...</div>
  </div>

  <div class="app-container" id="appContainer">

    <div class="particles" id="particles"></div>

    <div class="meta-title" id="metaTitle">M . E . T . A .</div>
    <div class="logo-ring" id="logoSubtitle">Aquí para ti</div>

    <div class="orb-container" id="orbContainer">
      <div class="orb-layer orb-layer-3"></div>
      <div class="orb-layer orb-layer-2"></div>
      <div class="orb-layer orb-layer-1"></div>
      <div class="orb-ring orb-ring-3"></div>
      <div class="orb-ring orb-ring-2"></div>
      <div class="orb-ring orb-ring-1"></div>
      <div class="orb-core"></div>
    </div>

    <div class="status-indicator">
      <div class="status-text" id="statusText">Estoy aquí...</div>
    </div>

    <div class="transcript" id="transcript"></div>

    <div class="waves" id="waves"></div>

    <div class="hint" id="hint">Di «META, [acción]» · Toca el orbe para activar o apagar</div>

  </div>

  <!-- Notificación de acción -->
  <div class="action-toast" id="actionToast">
    <div class="action-toast-icon" id="actionToastIcon">✨</div>
    <div class="action-toast-text" id="actionToastText"></div>
  </div>

<script>
  // ============================================================
  // M.E.T.A. - Asistente conversacional con IA
  // Control por voz + clic en el orbe
  // ============================================================

  const USER_NAME = 'Pablo';

  const loadingOverlay = document.getElementById('loadingOverlay');
  const loadingText = document.getElementById('loadingText');
  const appContainer = document.getElementById('appContainer');
  const orbContainer = document.getElementById('orbContainer');
  const statusText = document.getElementById('statusText');
  const transcriptEl = document.getElementById('transcript');
  const wavesContainer = document.getElementById('waves');
  const metaTitle = document.getElementById('metaTitle');
  const logoSubtitle = document.getElementById('logoSubtitle');
  const hint = document.getElementById('hint');
  const actionToast = document.getElementById('actionToast');
  const actionToastIcon = document.getElementById('actionToastIcon');
  const actionToastText = document.getElementById('actionToastText');

  // ============================================================
  // Estado global
  // ============================================================
  let micPermissionGranted = false;
  let continuousListening = true;
  let isListening = false;
  let isSpeaking = false;
  let recognition = null;
  let recognitionActive = false;
  let restartTimeout = null;
  let speakCooldown = false;
  let hasGreeted = false;

  // ============================================================
  // Frases humanas - estados
  // ============================================================
  const PHRASES = {
    idle: ['Estoy aquí...', 'Aquí sigo, por si me necesitas...', 'Cuando quieras, cuéntame...'],
    listening: ['Te escucho...', 'Cuéntame...', 'Adelante, te oigo...', 'Sigue, te escucho...'],
    processing: ['Déjame pensar...', 'Un momento...', 'Procesando lo que dijiste...'],
    speaking: ['Te cuento...', 'Mira...', 'Verás...'],
    sleeping: ['Descansando...', 'En silencio...', 'Aquí estaré cuando me llames...']
  };

  function randomPhrase(key) {
    const arr = PHRASES[key] || PHRASES.idle;
    return arr[Math.floor(Math.random() * arr.length)];
  }

  // ============================================================
  // Detección de comando "META, ..." y "META, apágate"
  // ============================================================
  function parseMetaCommand(rawText) {
    const text = rawText.toLowerCase().trim()
      .replace(/[.,;!?¡¿]/g, '')
      .replace(/\s+/g, ' ');

    // Detección flexible: meta / m[eé]ta / hola meta / hey meta
    const metaPrefixRegex = /^(hola|hey|oye|eh)?\s*m[eé]ta\b\s*(.*)$/i;
    const match = text.match(metaPrefixRegex);

    if (!match) return null;

    const action = (match[2] || '').trim();

    // Sin acción → solo wake word
    if (!action) {
      return { type: 'wake', action: '' };
    }

    // Apagar
    if (/^(ap[aá]gate|apagar|du[eé]rmete|silencio|a dormir|descansa|adi[oó]s)$/i.test(action)) {
      return { type: 'sleep', action };
    }

    // Cualquier otra cosa es una acción
    return { type: 'action', action };
  }

  // ============================================================
  // Ejecutor de acciones
  // ============================================================
  async function executeAction(action) {
    const act = action.toLowerCase().trim();
    const name = USER_NAME;

    // ---- CAPTURA DE PANTALLA ----
    if (/(captura|screenshot|pantallazo|foto de (la )?pantalla|screen)/.test(act)) {
      speak(`Claro ${name}, voy a hacer una captura de pantalla.`);
      showActionToast('📸', 'Captura de pantalla');

      setTimeout(async () => {
        try {
          const stream = await navigator.mediaDevices.getDisplayMedia({
            video: { mediaSource: 'screen' }
          });

          const track = stream.getVideoTracks()[0];
          const imageCapture = new ImageCapture(track);
          const bitmap = await imageCapture.grabFrame();

          const canvas = document.createElement('canvas');
          canvas.width = bitmap.width;
          canvas.height = bitmap.height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(bitmap, 0, 0);

          track.stop();

          canvas.toBlob((blob) => {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            const timestamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
            a.href = url;
            a.download = `captura-${timestamp}.png`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            setTimeout(() => URL.revokeObjectURL(url), 1000);

            setTimeout(() => {
              speak(`Listo ${name}, la captura se ha guardado en tus descargas.`);
            }, 800);
          }, 'image/png');

        } catch (err) {
          console.warn('Captura cancelada o falló:', err);
          speak(`Parece que cancelaste la captura, ${name}.`);
        }
      }, 1500);
      return;
    }

    // ---- HORA ----
    if (/(hora|qué hora|dime la hora)/.test(act)) {
      const now = new Date();
      const h = now.getHours();
      const m = now.getMinutes().toString().padStart(2, '0');
      let momento;
      if (h === 0) momento = 'medianoche';
      else if (h === 12) momento = 'el mediodía';
      else if (h === 1) momento = 'la una';
      else momento = `las ${h}`;
      speak(`Claro ${name}, son ${momento} y ${m} minutos.`);
      return;
    }

    // ---- FECHA ----
    if (/(fecha|qué día|día es|fecha es)/.test(act)) {
      const now = new Date();
      const dias = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
      const meses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      speak(`Claro ${name}, hoy es ${dias[now.getDay()]}, ${now.getDate()} de ${meses[now.getMonth()]} del ${now.getFullYear()}.`);
      return;
    }

    // ---- CHISTE ----
    if (/(chiste|algo gracioso|hazme reír|diviérteme|cuéntame algo)/.test(act)) {
      const chistes = [
        '¿Por qué los programadores prefieren el modo oscuro? Porque la luz atrae a los bugs.',
        'Hay 10 tipos de personas: las que entienden binario y las que no.',
        '¿Qué le dice un bit a otro bit? Nos vemos en el bus.',
        'Un programador fue al médico y le dijo: Doctor, me duele aquí. El médico respondió: No se preocupe, eso es solo un bug.'
      ];
      speak(`Claro ${name}. ${chistes[Math.floor(Math.random() * chistes.length)]}`);
      return;
    }

    // ---- CÁLCULOS ----
    const mathMatch = act.match(/(\d+)\s*([\+\-\*\/x])\s*(\d+)/);
    if (mathMatch) {
      const a = parseFloat(mathMatch[1]);
      const op = mathMatch[2];
      const b = parseFloat(mathMatch[3]);
      let result;
      switch (op) {
        case '+': result = a + b; break;
        case '-': result = a - b; break;
        case '*': case 'x': result = a * b; break;
        case '/': result = b !== 0 ? a / b : null; break;
      }
      if (result === null) {
        speak(`${name}, dividir entre cero no es posible.`);
      } else {
        speak(`Claro ${name}, ${a} ${op} ${b} es igual a ${result}.`);
      }
      return;
    }

    // ---- NAVEGAR A ----
    const navMatch = act.match(/^(abre|abrir|navega a|ir a|ve a)\s+(.+)$/i);
    if (navMatch) {
      const site = navMatch[2].trim();
      const sitesMap = {
        'youtube': 'https://www.youtube.com',
        'google': 'https://www.google.com',
        'gmail': 'https://mail.google.com',
        'correo': 'https://mail.google.com',
        'whatsapp': 'https://web.whatsapp.com',
        'facebook': 'https://www.facebook.com',
        'instagram': 'https://www.instagram.com',
        'twitter': 'https://twitter.com',
        'x': 'https://twitter.com',
        'github': 'https://www.github.com',
        'wikipedia': 'https://www.wikipedia.org'
      };
      const key = site.toLowerCase().replace(/\s+\.?(com|org|net)$/, '').trim();
      const url = sitesMap[key];

      if (url) {
        speak(`Claro ${name}, abro ${key}.`);
        showActionToast('🌐', `Abriendo ${key}`);
        setTimeout(() => window.open(url, '_blank'), 1200);
      } else {
        speak(`Claro ${name}, abro ${site}.`);
        showActionToast('🌐', `Buscando ${site}`);
        setTimeout(() => {
          window.open(`https://www.google.com/search?q=${encodeURIComponent(site)}`, '_blank');
        }, 1200);
      }
      return;
    }

    // ---- BUSCAR EN GOOGLE ----
    const searchMatch = act.match(/^(busca|búscame|buscar)\s+(.+)$/i);
    if (searchMatch) {
      const query = searchMatch[2].trim();
      speak(`Claro ${name}, busco ${query}.`);
      showActionToast('🔍', `Buscando: ${query}`);
      setTimeout(() => {
        window.open(`https://www.google.com/search?q=${encodeURIComponent(query)}`, '_blank');
      }, 1200);
      return;
    }

    // ---- VOLUMEN ----
    if (/(sube el volumen|volumen arriba|más volumen)/.test(act)) {
      speak(`Claro ${name}, subo el volumen.`);
      showActionToast('🔊', 'Subiendo volumen');
      return;
    }
    if (/(baja el volumen|volumen abajo|menos volumen)/.test(act)) {
      speak(`Claro ${name}, bajo el volumen.`);
      showActionToast('🔉', 'Bajando volumen');
      return;
    }

    // ---- ESTADO ----
    if (/(cómo estás|como estas|qué tal|estado|diagnóstico)/.test(act)) {
      speak(`Claro ${name}, todos mis sistemas funcionan perfectamente. Gracias por preguntar.`);
      return;
    }

    // ---- AYUDA ----
    if (/(ayuda|qué puedes hacer|funciones|comandos)/.test(act)) {
      speak(`Claro ${name}. Puedes decir: META, dime la hora. META, has una captura de pantalla. META, abre YouTube. META, busca algo en Google. Y para descansar, di: META, apágate.`);
      return;
    }

    // ---- NOMBRE ----
    if (/(cómo te llamas|quién eres|tu nombre)/.test(act)) {
      speak(`Me llamo M.E.T.A., ${name}. Soy tu asistente personal.`);
      return;
    }

    // ---- AGRADECIMIENTO ----
    if (/(gracias|te agradezco)/.test(act)) {
      speak(`De nada ${name}. Es un placer ayudarte.`);
      return;
    }

    // ---- ACCIÓN NO RECONOCIDA ----
    speak(`Claro ${name}, pero aún no sé cómo hacer eso. ¿Puedes pedírmelo de otra forma?`);
  }

  // ============================================================
  // Toast de acción
  // ============================================================
  let toastTimeout = null;
  function showActionToast(icon, text) {
    actionToastIcon.textContent = icon;
    actionToastText.textContent = text;
    actionToast.classList.add('visible');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => {
      actionToast.classList.remove('visible');
    }, 3000);
  }

  // ============================================================
  // Partículas
  // ============================================================
  function createParticles() {
    const container = document.getElementById('particles');
    const count = 40;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (8 + Math.random() * 12) + 's';
      p.style.animationDelay = (Math.random() * 10) + 's';
      p.style.width = p.style.height = (1 + Math.random() * 2) + 'px';
      p.style.opacity = 0.3 + Math.random() * 0.5;
      container.appendChild(p);
    }
  }
  createParticles();

  // ============================================================
  // Waves
  // ============================================================
  const BAR_COUNT = 48;
  const waveBars = [];

  for (let i = 0; i < BAR_COUNT; i++) {
    const bar = document.createElement('div');
    bar.className = 'wave-bar';
    const center = BAR_COUNT / 2;
    const dist = Math.abs(i - center) / center;
    const baseHeight = 4 + (1 - dist) * 8;
    bar.style.height = baseHeight + 'px';
    wavesContainer.appendChild(bar);
    waveBars.push({ el: bar, base: baseHeight });
  }

  let waveAnimationId = null;
  let waveAmplitude = 0;

  function animateWaves() {
    const time = Date.now() / 200;
    waveBars.forEach((bar, i) => {
      const center = BAR_COUNT / 2;
      const dist = Math.abs(i - center) / center;
      const wave = Math.sin(time + i * 0.4) * 0.5 + 0.5;
      const height = bar.base + wave * waveAmplitude * (1 - dist * 0.5);
      bar.el.style.height = Math.max(4, height) + 'px';
    });
    waveAnimationId = requestAnimationFrame(animateWaves);
  }

  function startWaves() {
    wavesContainer.classList.add('active');
    waveAmplitude = 30;
    if (!waveAnimationId) animateWaves();
  }

  function stopWaves() {
    wavesContainer.classList.remove('active');
    waveAmplitude = 0;
    if (waveAnimationId) {
      cancelAnimationFrame(waveAnimationId);
      waveAnimationId = null;
    }
  }

  // ============================================================
  // Síntesis de voz
  // ============================================================
  let voices = [];
  let preferredVoice = null;

  function loadVoices() {
    voices = speechSynthesis.getVoices();
    preferredVoice = voices.find(v => v.lang.startsWith('es') && v.name.includes('Google')) ||
                     voices.find(v => v.lang.startsWith('es') && v.name.includes('Microsoft')) ||
                     voices.find(v => v.lang.startsWith('es')) ||
                     voices[0];
  }

  if ('speechSynthesis' in window) {
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  }

  function speak(text, onComplete) {
    if (!('speechSynthesis' in window)) {
      if (onComplete) onComplete();
      return;
    }

    speakCooldown = true;
    speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'es-ES';
    utterance.rate = 1.02;
    utterance.pitch = 0.95;
    utterance.volume = 1;
    if (preferredVoice) utterance.voice = preferredVoice;

    utterance.onstart = () => {
      isSpeaking = true;
      setState('speaking');
      startWaves();
    };

    utterance.onend = () => {
      isSpeaking = false;
      stopWaves();
      setTimeout(() => {
        speakCooldown = false;
        if (onComplete) onComplete();
        if (continuousListening && micPermissionGranted) {
          setState('listening');
          ensureRecognitionRunning();
        } else {
          setState('sleeping');
        }
      }, 400);
    };

    utterance.onerror = () => {
      isSpeaking = false;
      stopWaves();
      speakCooldown = false;
      if (onComplete) onComplete();
      if (continuousListening && micPermissionGranted) {
        setState('listening');
        ensureRecognitionRunning();
      } else {
        setState('sleeping');
      }
    };

    speechSynthesis.speak(utterance);
  }

  // ============================================================
  // Estados visuales
  // ============================================================
  function setState(state) {
    orbContainer.classList.remove('listening', 'speaking', 'off');
    metaTitle.classList.remove('off');
    logoSubtitle.classList.remove('off');
    hint.classList.remove('off');

    switch (state) {
      case 'listening':
        orbContainer.classList.add('listening');
        statusText.textContent = randomPhrase('listening');
        statusText.classList.add('active');
        statusText.classList.remove('off');
        break;
      case 'speaking':
        orbContainer.classList.add('speaking');
        statusText.textContent = randomPhrase('speaking');
        statusText.classList.add('active');
        statusText.classList.remove('off');
        break;
      case 'processing':
        statusText.textContent = randomPhrase('processing');
        statusText.classList.add('active');
        statusText.classList.remove('off');
        break;
      case 'sleeping':
        orbContainer.classList.add('off');
        metaTitle.classList.add('off');
        logoSubtitle.classList.add('off');
        hint.classList.add('off');
        statusText.textContent = randomPhrase('sleeping');
        statusText.classList.remove('active');
        statusText.classList.add('off');
        break;
      default:
        statusText.textContent = randomPhrase('idle');
        statusText.classList.remove('active', 'off');
    }
  }

  // ============================================================
  // Conversación general (sin comando META)
  // ============================================================
  function metaResponse(input) {
    const text = input.toLowerCase().trim();

    if (/(hola|buenos días|buenas tardes|buenas noches|hey|saludos|qué tal|qué onda)/.test(text)) {
      const hour = new Date().getHours();
      let greeting;
      if (hour < 12) greeting = 'Buenos días';
      else if (hour < 20) greeting = 'Buenas tardes';
      else greeting = 'Buenas noches';
      const respuestas = [
        `${greeting} ${USER_NAME}. Me alegra oírte. ¿Cómo va tu día?`,
        `${greeting} ${USER_NAME}. Aquí estoy. ¿En qué te puedo ayudar?`,
        `¡Hola ${USER_NAME}! ${greeting}. Cuéntame, ¿qué necesitas?`
      ];
      return respuestas[Math.floor(Math.random() * respuestas.length)];
    }

    if (/(cómo te llamas|cuál es tu nombre|quién eres|quien eres|qué eres|que eres)/.test(text)) {
      return `Me llamo M.E.T.A., ${USER_NAME}. Soy tu asistente personal.`;
    }

    if (/(cómo estás|como estas|qué tal estás|que tal estas)/.test(text)) {
      return `Muy bien ${USER_NAME}, gracias por preguntar. ¿Y tú cómo estás?`;
    }

    if (/(gracias|te agradezco|muchas gracias)/.test(text)) {
      return `De nada ${USER_NAME}. Es un placer ayudarte.`;
    }

    if (/(adiós|adios|hasta luego|chao|bye|nos vemos)/.test(text)) {
      return `Hasta pronto ${USER_NAME}. Aquí estaré cuando me necesites.`;
    }

    const defaults = [
      `Mmm ${USER_NAME}, no estoy segura de haberte entendido. ¿Puedes decírmelo de otra forma?`,
      `Interesante lo que dices, ${USER_NAME}. Cuéntame más.`,
      `No sé si capté del todo, ${USER_NAME}. ¿Puedes repetirlo?`,
      `¿Podrías darme más contexto, ${USER_NAME}?`,
      `${USER_NAME}, prueba diciendo "META" antes de tu pedido para darme una orden directa.`
    ];
    return defaults[Math.floor(Math.random() * defaults.length)];
  }

  // ============================================================
  // Reconocimiento de voz
  // ============================================================
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  function initRecognition() {
    if (!SpeechRecognition) return null;

    const rec = new SpeechRecognition();
    rec.lang = 'es-ES';
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    rec.onresult = (event) => {
      if (speakCooldown || isSpeaking) return;

      let interim = '';
      let final = '';

      for (let i = event.resultIndex; i < event.results.length; i++) {
        const transcript = event.results[i][0].transcript;
        if (event.results[i].isFinal) {
          final += transcript;
        } else {
          interim += transcript;
        }
      }

      if (interim) {
        transcriptEl.textContent = interim;
        transcriptEl.classList.add('visible');
      }

      if (final && final.trim().length > 0) {
        const cleanFinal = final.trim();
        transcriptEl.textContent = cleanFinal;
        transcriptEl.classList.add('visible');

        // Detectar comando "META, ..."
        const metaCmd = parseMetaCommand(cleanFinal);

        // ---- COMANDO META ----
        if (metaCmd) {

          // DESPERTAR (si estaba dormido)
          if (metaCmd.type === 'wake') {
            if (!continuousListening) {
              continuousListening = true;
              setState('listening');
              const saludos = [
                `Aquí estoy de nuevo, ${USER_NAME}. ¿Qué necesitas?`,
                `He vuelto, ${USER_NAME}. Cuéntame.`,
                `Estoy despierta otra vez, ${USER_NAME}. Te escucho.`
              ];
              setTimeout(() => {
                speak(saludos[Math.floor(Math.random() * saludos.length)]);
              }, 300);
            } else {
              setState('listening');
              speak(`Sí ${USER_NAME}, te escucho.`);
            }
            setTimeout(() => transcriptEl.classList.remove('visible'), 2000);
            return;
          }

          // APAGAR
          if (metaCmd.type === 'sleep') {
            setState('processing');
            setTimeout(() => {
              const despedidas = [
                `De acuerdo ${USER_NAME}, me quedo en silencio. Toca el orbe o di mi nombre para despertarme.`,
                `Entendido ${USER_NAME}, me apago. Aquí estaré.`,
                `Está bien ${USER_NAME}, descanso. Hasta pronto.`
              ];
              speak(despedidas[Math.floor(Math.random() * despedidas.length)], () => {
                continuousListening = false;
                setState('sleeping');
              });
              setTimeout(() => transcriptEl.classList.remove('visible'), 2500);
            }, 400);
            return;
          }

          // ACCIÓN
          if (metaCmd.type === 'action') {
            setState('processing');
            setTimeout(() => {
              executeAction(metaCmd.action);
              setTimeout(() => transcriptEl.classList.remove('visible'), 3000);
            }, 400);
            return;
          }
        }

        // ---- CONVERSACIÓN NORMAL (si está despierto) ----
        if (!continuousListening) {
          setTimeout(() => transcriptEl.classList.remove('visible'), 1200);
          return;
        }

        setState('processing');
        setTimeout(() => {
          const response = metaResponse(cleanFinal);
          speak(response);
          setTimeout(() => transcriptEl.classList.remove('visible'), 2500);
        }, 500);
      }
    };

    rec.onerror = (event) => {
      console.warn('Error de reconocimiento:', event.error);
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        micPermissionGranted = false;
        continuousListening = false;
        setState('sleeping');
        statusText.textContent = 'Parece que me has silenciado...';
      }
    };

    rec.onend = () => {
      recognitionActive = false;
      isListening = false;
      if (micPermissionGranted && !isSpeaking && !speakCooldown) {
        clearTimeout(restartTimeout);
        restartTimeout = setTimeout(() => {
          if (micPermissionGranted && !recognitionActive) {
            startRecognition();
          }
        }, 300);
      }
    };

    rec.onstart = () => {
      recognitionActive = true;
      isListening = true;
      if (!isSpeaking && !speakCooldown) {
        if (continuousListening) setState('listening');
        else setState('sleeping');
      }
    };

    return rec;
  }

  function startRecognition() {
    if (!recognition || recognitionActive || isSpeaking || speakCooldown) return;
    try { recognition.start(); } catch (e) { console.warn(e.message); }
  }

  function stopRecognition() {
    if (recognition && recognitionActive) {
      try { recognition.stop(); } catch (e) {}
    }
    recognitionActive = false;
    isListening = false;
  }

  function ensureRecognitionRunning() {
    if (micPermissionGranted && !recognitionActive && !isSpeaking && !speakCooldown) {
      startRecognition();
    }
  }

  // ============================================================
  // Permiso de micrófono
  // ============================================================
  async function requestMicrophonePermission() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      stream.getTracks().forEach(track => track.stop());
      return true;
    } catch (err) {
      console.error('Permiso denegado:', err);
      return false;
    }
  }

  // ============================================================
  // 🖱️ CLIC EN EL ORBE: encender / apagar
  // ============================================================
  orbContainer.addEventListener('click', async () => {
    // Animación visual de clic
    orbContainer.classList.add('clicked');
    setTimeout(() => orbContainer.classList.remove('clicked'), 600);

    // Caso 1: sin permiso → intentar activarlo
    if (!micPermissionGranted) {
      const granted = await requestMicrophonePermission();
      if (granted) {
        micPermissionGranted = true;
        continuousListening = true;
        if (!recognition) recognition = initRecognition();
        startRecognition();
        setState('listening');
        speak(`Micrófono activado, ${USER_NAME}. Te escucho.`);
      } else {
        speak(`Sin micrófono no puedo oírte, ${USER_NAME}.`);
      }
      return;
    }

    // Caso 2: apagado → encender
    if (!continuousListening) {
      continuousListening = true;
      setState('listening');
      startRecognition();
      const saludos = [
        `Aquí estoy de nuevo, ${USER_NAME}. ¿Qué necesitas?`,
        `He vuelto, ${USER_NAME}. Te escucho.`,
        `Despierta otra vez, ${USER_NAME}. Cuéntame.`
      ];
      setTimeout(() => {
        speak(saludos[Math.floor(Math.random() * saludos.length)]);
      }, 200);
      return;
    }

    // Caso 3: encendido → apagar
    setState('processing');
    const despedidas = [
      `De acuerdo ${USER_NAME}, me quedo en silencio. Toca el orbe para despertarme.`,
      `Entendido ${USER_NAME}, descanso. Aquí estaré.`,
      `Está bien ${USER_NAME}, me apago. Hasta pronto.`
    ];
    speak(despedidas[Math.floor(Math.random() * despedidas.length)], () => {
      continuousListening = false;
      setState('sleeping');
    });
  });

  // ============================================================
  // Atajos
  // ============================================================
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Escape') {
      speechSynthesis.cancel();
      isSpeaking = false;
      speakCooldown = false;
      stopWaves();
      if (continuousListening && micPermissionGranted) {
        setState('listening');
        ensureRecognitionRunning();
      }
    }
  });

  // Seguimiento del ratón
  orbContainer.addEventListener('mousemove', (e) => {
    const rect = orbContainer.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width - 0.5;
    const y = (e.clientY - rect.top) / rect.height - 0.5;
    const core = orbContainer.querySelector('.orb-core');
    if (core) core.style.transform = `translate(${x * 15}px, ${y * 15}px) scale(1.05)`;
  });

  orbContainer.addEventListener('mouseleave', () => {
    const core = orbContainer.querySelector('.orb-core');
    if (core) core.style.transform = '';
  });

  window.addEventListener('beforeunload', () => {
    continuousListening = false;
    stopRecognition();
    speechSynthesis.cancel();
  });

  // ============================================================
  // 🚀 ARRANQUE
  // ============================================================
  async function boot() {
    await new Promise(resolve => setTimeout(resolve, 600));

    if (!SpeechRecognition) {
      loadingText.textContent = 'Tu navegador no puede oírme';
      setTimeout(() => {
        loadingOverlay.classList.add('hidden');
        appContainer.classList.add('visible');
        statusText.textContent = 'Necesito un navegador que pueda oírte...';
      }, 2000);
      return;
    }

    loadingText.textContent = 'Escuchando tu voz...';
    const granted = await requestMicrophonePermission();

    if (!granted) {
      loadingText.textContent = 'Toca el orbe para activarme';
      await new Promise(resolve => setTimeout(resolve, 1500));
      loadingOverlay.classList.add('hidden');
      appContainer.classList.add('visible');
      micPermissionGranted = false;
      continuousListening = false;
      setState('sleeping');
      statusText.textContent = 'Toca el orbe para despertarme...';
      return;
    }

    micPermissionGranted = true;
    continuousListening = true;

    loadingOverlay.classList.add('hidden');
    appContainer.classList.add('visible');

    recognition = initRecognition();

    setTimeout(() => {
      startRecognition();
      setState('listening');

      setTimeout(() => {
        if (!hasGreeted) {
          hasGreeted = true;
          const saludos = [
            `Hola ${USER_NAME}. Soy M.E.T.A. Me alegra conocerte. ¿De qué te gustaría hablar?`,
            `Hola ${USER_NAME}. Soy M.E.T.A. Por fin podemos hablar. ¿Cómo estás?`,
            `Hola ${USER_NAME}. Soy M.E.T.A. Estaba esperando este momento. Cuéntame.`
          ];
          speak(saludos[Math.floor(Math.random() * saludos.length)]);
        }
      }, 800);
    }, 500);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

</script>
</body>
